<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Live ERP System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
    .card { border-radius: 10px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .nav-pills .nav-link.active { background-color: #0d6efd; }
    .live-status { width: 8px; height: 8px; background: #198754; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">
        <i class="fa-solid fa-store me-2"></i> Shop Management
      </span>
      <span class="badge bg-light text-dark d-flex align-items-center gap-2">
        <span class="live-status"></span> Live Sync Active
      </span>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4">
      
      <!-- FORM: INPUT DATA -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus-circle text-primary me-2"></i>Add New Product</h5>
          <form id="productForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Product Name</label>
              <input type="text" id="pName" class="form-control" placeholder="e.g. Laptop" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Price ($)</label>
              <input type="number" step="0.01" id="pPrice" class="form-control" placeholder="0.00" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Stock Quantity</label>
              <input type="number" id="pStock" class="form-control" placeholder="0" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Save Product</button>
          </form>
        </div>
      </div>

      <!-- TABLE: SHOW & LIVE UPDATE DATA -->
      <div class="col-md-8">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0"><i class="fa-solid fa-boxes-stacked text-success me-2"></i>Product List</h5>
            <button class="btn btn-sm btn-outline-danger" onclick="clearAllData()">
              <i class="fa-solid fa-trash me-1"></i> Clear All Data
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Product Name</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody id="productTable">
                <!-- Data will appear here automatically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 1. Get products from LocalStorage
    function getProducts() {
      return JSON.parse(localStorage.getItem('products_data')) || [];
    }

    // 2. Save products to LocalStorage
    function saveProducts(products) {
      localStorage.setItem('products_data', JSON.stringify(products));
      renderTable(); // Instant local refresh
    }

    // 3. Render Data to HTML Table
    function renderTable() {
      const products = getProducts();
      const tbody = document.getElementById('productTable');
      tbody.innerHTML = '';

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">No data available. Add a product from the left form!</td></tr>`;
        return;
      }

      products.forEach((p, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td class="fw-bold">${p.name}</td>
            <td>$${parseFloat(p.price).toFixed(2)}</td>
            <td><span class="badge bg-success">${p.stock} Units</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-danger" onclick="deleteProduct(${index})">
                <i class="fa-solid fa-trash"></i> Delete
              </button>
            </td>
          </tr>
        `;
      });
    }

    // 4. Form Submit Handler (Add Product)
    document.getElementById('productForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newProduct = {
        name: document.getElementById('pName').value,
        price: document.getElementById('pPrice').value,
        stock: document.getElementById('pStock').value
      };

      const products = getProducts();
      products.push(newProduct);
      saveProducts(products);

      document.getElementById('productForm').reset();
    });

    // 5. Delete Item
    function deleteProduct(index) {
      const products = getProducts();
      products.splice(index, 1);
      saveProducts(products);
    }

    // 6. Clear All Data
    function clearAllData() {
      if (confirm('Are you sure you want to delete all saved data?')) {
        localStorage.removeItem('products_data');
        renderTable();
      }
    }

    // 7. REAL LIVE UPDATE LISTENER (Auto-updates when data changes across tabs)
    window.addEventListener('storage', () => {
      renderTable();
    });

    // Initial Load when opening page
    renderTable();
  </script>
</body>
</html>
