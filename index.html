<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Inventory & Sales Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container my-4">
    <h2 class="text-center mb-4 text-primary fw-bold">Smart Inventory Dashboard</h2>

    <div class="row g-4 mb-4">
      <!-- Add Product -->
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-success text-white fw-bold">Add New Product</div>
          <div class="card-body">
            <form id="addProductForm">
              <div class="mb-3">
                <input type="text" id="pName" class="form-control" placeholder="Product Name" required>
              </div>
              <div class="mb-3">
                <input type="number" step="0.01" id="pPrice" class="form-control" placeholder="Price" required>
              </div>
              <div class="mb-3">
                <input type="number" id="pStock" class="form-control" placeholder="Stock Quantity" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Add Product</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Sell Product -->
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white fw-bold">Sell Product</div>
          <div class="card-body">
            <form id="sellProductForm">
              <div class="mb-3">
                <select id="sProduct" class="form-select" required>
                  <option value="">Select Product</option>
                </select>
              </div>
              <div class="mb-3">
                <input type="number" id="sQuantity" class="form-control" placeholder="Quantity" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Complete Sale</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Inventory Table -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-dark text-white fw-bold">Current Inventory</div>
      <div class="card-body p-0">
        <table class="table table-striped mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Product Name</th>
              <th>Price</th>
              <th>Stock</th>
            </tr>
          </thead>
          <tbody id="inventoryTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Sales Table -->
    <div class="card shadow-sm border-0">
      <div class="card-header bg-secondary text-white fw-bold">Sales History</div>
      <div class="card-body p-0">
        <table class="table table-striped mb-0">
          <thead class="table-secondary">
            <tr>
              <th>Sale ID</th>
              <th>Product Name</th>
              <th>Quantity Sold</th>
              <th>Total Amount</th>
              <th>Date & Time</th>
            </tr>
          </thead>
          <tbody id="salesTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';

    async function loadData() {
      // Load Products
      const pRes = await fetch(`${API_BASE}/api/products`);
      const products = await pRes.json();
      
      const invBody = document.getElementById('inventoryTable');
      const select = document.getElementById('sProduct');
      invBody.innerHTML = '';
      select.innerHTML = '<option value="">Select Product</option>';

      products.forEach(p => {
        invBody.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>$${p.price}</td>
            <td>${p.stock}</td>
          </tr>
        `;
        select.innerHTML += `<option value="${p.id}">${p.name} (Stock: ${p.stock})</option>`;
      });

      // Load Sales
      const sRes = await fetch(`${API_BASE}/api/sales`);
      const sales = await sRes.json();
      const salesBody = document.getElementById('salesTable');
      salesBody.innerHTML = '';

      sales.forEach(s => {
        salesBody.innerHTML += `
          <tr>
            <td>${s.id}</td>
            <td>${s.product_name}</td>
            <td>${s.quantity}</td>
            <td>$${s.total_price}</td>
            <td>${new Date(s.sale_date).toLocaleString()}</td>
          </tr>
        `;
      });
    }

    // Add Product Event
    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('pName').value;
      const price = document.getElementById('pPrice').value;
      const stock = document.getElementById('pStock').value;

      const res = await fetch(`${API_BASE}/api/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, stock })
      });

      if (res.ok) {
        document.getElementById('addProductForm').reset();
        loadData();
      } else {
        alert('Failed to add product');
      }
    });

    // Sell Product Event
    document.getElementById('sellProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const product_id = document.getElementById('sProduct').value;
      const quantity = document.getElementById('sQuantity').value;

      const res = await fetch(`${API_BASE}/api/sales`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product_id, quantity })
      });

      if (res.ok) {
        document.getElementById('sellProductForm').reset();
        loadData();
      } else {
        const err = await res.json();
        alert(err.error || 'Sale failed');
      }
    });

    // Initial Load
    loadData();
  </script>
</body>
</html>
