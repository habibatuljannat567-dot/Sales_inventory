<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121621; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        .login-card { background-color: #1a1f2c; padding: 40px; border-radius: 12px; width: 380px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .login-card h2 { color: #ff2b2b; font-size: 24px; font-weight: 700; margin-bottom: 25px; line-height: 1.3; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; color: #a0aec0; font-size: 13px; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px 15px; border-radius: 6px; border: 1px solid #2d3748; background-color: #eef2f7; color: #1a202c; font-size: 15px; outline: none; }
        .input-group input[type="password"] { background-color: #0d1117; color: #ffffff; border: 1px solid #21262d; }
        .btn-login { width: 100%; padding: 12px; background-color: #ff2b2b; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background-color: #d92323; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Smart Inventory Management System</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email address</label>
                <input type="text" id="email" value="admin@gmail.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" value="12345" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // সাধারণ ডেমো রিডাইরেকশন
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
